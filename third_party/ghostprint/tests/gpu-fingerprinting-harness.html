<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostPrint GPU fingerprinting harness</title>
  <style>
    body { max-width: 72rem; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
    button { padding: 0.6rem 1rem; }
    pre { overflow: auto; padding: 1rem; background: #111; color: #eee; }
  </style>
</head>
<body>
  <h1>GhostPrint GPU fingerprinting harness</h1>
  <p>Run this page repeatedly, then compare normal frames, iframes, storage contexts, and sessions.</p>
  <button id="run" type="button">Collect GPU surfaces</button>
  <pre id="output">Not run.</pre>
  <script>
    'use strict';

    function smokeWebGL(gl) {
      if (!gl) return false;
      const vertex = gl.createShader(gl.VERTEX_SHADER);
      const fragment = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(vertex, 'attribute vec2 p; void main(){gl_Position=vec4(p,0.0,1.0);}');
      gl.shaderSource(fragment, 'void main(){gl_FragColor=vec4(1.0,0.0,0.0,1.0);}');
      gl.compileShader(vertex);
      gl.compileShader(fragment);
      const program = gl.createProgram();
      gl.attachShader(program, vertex);
      gl.attachShader(program, fragment);
      gl.linkProgram(program);
      const buffer = gl.createBuffer();
      const texture = gl.createTexture();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, 0, 1]), gl.STATIC_DRAW);
      gl.useProgram(program);
      const location = gl.getAttribLocation(program, 'p');
      gl.enableVertexAttribArray(location);
      gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      const pixels = new Uint8Array(4);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      const linked = gl.getProgramParameter(program, gl.LINK_STATUS);
      gl.deleteTexture(texture);
      gl.deleteBuffer(buffer);
      gl.deleteProgram(program);
      gl.deleteShader(vertex);
      gl.deleteShader(fragment);
      return Boolean(linked);
    }

    function collectWebGL(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const gl = canvas.getContext(type);
      if (!gl) return null;
      const supportedExtensions = gl.getSupportedExtensions();
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      const syntheticExtension = supportedExtensions && supportedExtensions.at(-1);
      const syntheticObject = syntheticExtension ? gl.getExtension(syntheticExtension) : null;
      return {
        vendor: gl.getParameter(gl.VENDOR),
        renderer: gl.getParameter(gl.RENDERER),
        unmaskedVendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : null,
        unmaskedRenderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : null,
        supportedExtensions,
        syntheticExtension,
        syntheticObjectTag: syntheticObject ? Object.prototype.toString.call(syntheticObject) : null,
        smokeRender: smokeWebGL(gl),
      };
    }

    async function collectWebGPU() {
      if (!navigator.gpu) return null;
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) return null;
      const info = adapter.info;
      const device = await adapter.requestDevice();
      return {
        vendor: info.vendor,
        architecture: info.architecture,
        device: info.device,
        description: info.description,
        adapterFeatures: Array.from(adapter.features),
        adapterLimitsAvailable: Boolean(adapter.limits),
        requestDevice: Boolean(device),
        deviceAdapterInfo: device.adapterInfo ? {
          vendor: device.adapterInfo.vendor,
          architecture: device.adapterInfo.architecture,
          device: device.adapterInfo.device,
          description: device.adapterInfo.description,
        } : null,
      };
    }

    async function collect() {
      return {
        webgl: collectWebGL('webgl'),
        experimentalWebgl: collectWebGL('experimental-webgl'),
        webgl2: collectWebGL('webgl2'),
        webgpu: await collectWebGPU(),
      };
    }

    document.getElementById('run').addEventListener('click', async () => {
      const output = document.getElementById('output');
      output.textContent = 'Collecting…';
      try {
        const result = await collect();
        output.textContent = JSON.stringify(result, null, 2);
        window.__ghostPrintGPUHarnessResult = result;
      } catch (error) {
        output.textContent = `${error.name}: ${error.message}`;
        throw error;
      }
    });
  </script>
</body>
</html>
